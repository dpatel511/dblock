name: Recipe check

# Weekly check that every bundled recipe still matches upstream (URL answers,
# size, Zenodo checksum, Zenodo record still the latest). Downloads 1 byte per URL.
# A failed run means a recipe needs attention; it never changes recipes itself.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_recipes.py
