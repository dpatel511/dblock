name = "pfam"
description = "Pfam-A profile HMMs (EBI), as one HMMER flat file for hmmsearch"
homepage = "https://ftp.ebi.ac.uk/pub/databases/Pfam/releases/"
tool = "hmmsearch"
version_command = ["hmmsearch", "-h"]
citation = "Paysan-Lafosse T et al. (2025) The Pfam protein families database: embracing AI/ML. Nucleic Acids Research 53:D523-D534"
notes = [
  "MD5s are from each release's md5_checksums file; sizes from the server; release month from relnotes.txt (Pfam gives month and year only). Checked 2026-11-14.",
  "Pfam-A.hmm.gz is decompressed to one file. It can be used as is with hmmsearch: hmmsearch \"$(dblock path pfam --tool)\" proteins.faa. hmmscan and pfam_scan.pl need hmmpress first, which writes index files next to it; dblock does not build indexes, and verify would report those files as unexpected.",
  "The local file name includes the release (e.g. Pfam-A.39.0.hmm) because every release is served as Pfam-A.hmm.gz.",
  "Licence: CC0 1.0 (relnotes.txt). No tool-version rule is stated upstream.",
]

