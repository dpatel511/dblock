name = "gunc"
description = "GUNC reference databases (DIAMOND .dmnd) for chimerism and contamination detection"
homepage = "https://grp-bork.embl-community.io/gunc/"
tool = "gunc"
version_command = ["gunc", "--version"]
tool_env = "GUNC_DB"
citation = "Orakov A et al. (2021) GUNC: detection of chimerism and contamination in prokaryotic genomes. Genome Biology 22:178"
notes = [
  "URLs, sizes and archive MD5s are from the Zenodo API, checked 2026-11-11; the MD5s match the ones in GUNC 1.1.1's gunc_database.py.",
  "Each release is one gzipped DIAMOND file; dblock unpacks it to the .dmnd file GUNC reads from GUNC_DB or --db_file (gunc.py, checked against GUNC 1.1.1 source).",
  "progenomes_2.1 is listed first because it is GUNC's default database. GUNC 1.1.1 also accepts progenomes_3 and gtdb_214; older GUNC versions were not checked, so no tool-version rule is stated.",
  "Dates are the Zenodo publication dates of the records, not database build dates.",
  "GUNC also publishes an MD5 of the unpacked .dmnd; dblock checks the archive MD5 and records its own SHA-256 of the unpacked file.",
]

