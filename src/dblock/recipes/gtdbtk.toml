name = "gtdbtk"
description = "GTDB-Tk reference data package (GTDB release)"
homepage = "https://ecogenomics.github.io/GTDBTk/installing/index.html"
tool = "gtdbtk"
version_command = ["gtdbtk", "--version"]
tool_env = "GTDBTK_DATA_PATH"
citation = "Chaumeil P-A et al. (2022) GTDB-Tk v2. Bioinformatics 38(23):5315-5316"
notes = [
  "MD5s are from GTDB's MD5SUM.txt for each release (data.gtdb.ecogenomic.org and the data.ace.uq.edu.au mirror give the same values) and match the GTDB-Tk installation docs; checked 2026-11-12. dblock has not downloaded these archives to confirm them; fetch checks them.",
  "Lockfiles that pinned a release before these MD5s were added (dblock 0.3.1 and earlier) carry no upstream checksum; they are still checked against the SHA-256 recorded at their first download.",
  "Compatibility ranges are from the GTDB-Tk installation docs.",
  "GTDB-Tk reads the release folder from GTDBTK_DATA_PATH (config/common.py, checked against GTDB-Tk 2.8.0 source, 2026-11-10). Use `dblock env` or `dblock path gtdbtk --tool`.",
]

