homepage = "https://benlangmead.github.io/aws-indexes/k2"
tool = "kraken2"
version_command = ["kraken2", "--version"]
citation = "Wood DE, Lu J, Langmead B (2019) Improved metagenomic analysis with Kraken 2. Genome Biology 20:257"
notes = [
  "Archive MD5s come from the collection's published .md5 files (https://genome-idx.s3.amazonaws.com/kraken/<collection>_<date>/<collection>.md5), checked 2026-11-10.",
  "standard-8gb-20240904 has no checksum: its .md5 file names k2_standard08gb_20240904.tar.gz, not the served k2_standard_08gb_20240904.tar.gz, so it is not used. dblock records the SHA-256 at first download.",
  "From 2025-07 upstream names the 8 GB indexes k2_standard_08_GB_<date> instead of k2_standard_08gb_<date>.",
  "No tool-version rule is stated upstream for these indexes.",
]

